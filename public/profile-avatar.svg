<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Gradient Background Circle -->
  <defs>
    <linearGradient id="avatarGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background Circle -->
  <circle cx="100" cy="100" r="100" fill="url(#avatarGradient)"/>

  <!-- Person Icon -->
  <g transform="translate(100, 100)">
    <!-- Head -->
    <circle cx="0" cy="-15" r="28" fill="white" opacity="0.9"/>

    <!-- Body -->
    <path d="M -45 60 Q -45 20 -30 10 Q -15 0 0 0 Q 15 0 30 10 Q 45 20 45 60 Z" fill="white" opacity="0.9"/>
  </g>

  <!-- Subtle shine effect -->
  <circle cx="100" cy="100" r="100" fill="url(#shine)" opacity="0.3"/>
  <defs>
    <radialGradient id="shine">
      <stop offset="0%" style="stop-color:white;stop-opacity:0.4" />
      <stop offset="100%" style="stop-color:white;stop-opacity:0" />
    </radialGradient>
  </defs>
</svg>

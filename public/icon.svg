<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background with gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="scoreGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FF9B6B;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#FFD56B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00D26A;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="115" fill="url(#bgGradient)"/>

  <!-- Credit card outline -->
  <rect x="96" y="180" width="320" height="200" rx="20" fill="white" opacity="0.2"/>
  <rect x="96" y="180" width="320" height="200" rx="20" stroke="white" stroke-width="4" fill="none"/>

  <!-- Chip -->
  <rect x="130" y="220" width="50" height="40" rx="8" fill="white" opacity="0.8"/>
  <rect x="135" y="225" width="40" height="30" rx="4" fill="url(#bgGradient)"/>

  <!-- Score gauge arc -->
  <circle cx="340" cy="280" r="55" stroke="white" stroke-width="8" fill="none" opacity="0.3" stroke-dasharray="173 173"/>
  <circle cx="340" cy="280" r="55" stroke="url(#scoreGradient)" stroke-width="8" fill="none" stroke-dasharray="130 173" stroke-linecap="round" transform="rotate(-90 340 280)"/>

  <!-- Score text -->
  <text x="340" y="290" font-family="system-ui, sans-serif" font-size="36" font-weight="bold" fill="white" text-anchor="middle">750</text>

  <!-- Star icon -->
  <path d="M256 410 L266 435 L292 438 L274 455 L278 481 L256 469 L234 481 L238 455 L220 438 L246 435 Z" fill="white" opacity="0.9"/>
</svg>

<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Gradient definitions -->
  <defs>
    <linearGradient id="mainGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="scoreGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#34d399;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Main background -->
  <rect width="512" height="512" rx="115" fill="url(#mainGradient)"/>

  <!-- Outer circle ring -->
  <circle cx="256" cy="256" r="200" stroke="white" stroke-width="8" fill="none" opacity="0.3"/>

  <!-- Shield/Badge shape -->
  <path d="M 256 80 L 340 110 L 340 240 Q 340 350 256 420 Q 172 350 172 240 L 172 110 Z" fill="white" opacity="0.15"/>
  <path d="M 256 80 L 340 110 L 340 240 Q 340 350 256 420 Q 172 350 172 240 L 172 110 Z" stroke="white" stroke-width="6" fill="none" opacity="0.5"/>

  <!-- CS Monogram -->
  <g transform="translate(256, 220)">
    <!-- C -->
    <path d="M -50 -35 Q -80 -35 -80 0 Q -80 35 -50 35 L -40 35 L -40 20 L -50 20 Q -65 20 -65 0 Q -65 -20 -50 -20 L -40 -20 L -40 -35 Z" fill="white"/>

    <!-- S -->
    <path d="M 20 -35 L 70 -35 L 70 -20 L 25 -20 L 25 -5 L 65 -5 L 65 35 L 20 35 L 20 20 L 60 20 L 60 10 L 20 10 Z" fill="white"/>
  </g>

  <!-- Score indicator -->
  <g transform="translate(256, 320)">
    <!-- Score bar background -->
    <rect x="-60" y="0" width="120" height="12" rx="6" fill="white" opacity="0.3"/>
    <!-- Score bar fill -->
    <rect x="-60" y="0" width="90" height="12" rx="6" fill="url(#scoreGlow)"/>

    <!-- Score text -->
    <text x="0" y="38" font-family="system-ui, sans-serif" font-size="28" font-weight="bold" fill="white" text-anchor="middle">750+</text>
  </g>

  <!-- Decorative stars -->
  <circle cx="380" cy="150" r="4" fill="url(#accentGradient)"/>
  <circle cx="410" cy="200" r="3" fill="white" opacity="0.6"/>
  <circle cx="132" cy="150" r="3" fill="white" opacity="0.6"/>
  <circle cx="102" cy="200" r="4" fill="url(#accentGradient)"/>

  <!-- Checkmark accent -->
  <path d="M 256 400 L 270 415 L 300 380" stroke="url(#scoreGlow)" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
